name: Validate Oracle automation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible_core: ['2.20.0', '2.21.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install 'ansible-core==${{ matrix.ansible_core }}' 'PyYAML==6.0.3' 'ansible-lint==25.9.2'
      - name: Validate offline project contracts
        run: python tests/verify_contract.py
      - name: Install the four collections from source (same path as a CLI user)
        working-directory: acme_oracle_control
        run: ansible-galaxy collection install -r requirements-local.yml -p collections --force
      - name: Check playbook syntax for every release and example
        working-directory: acme_oracle_control
        run: |
          for release in 19c 26ai; do
            for params in params/examples/${release}_*.yml; do
              ansible-playbook -e @"$params" --syntax-check "playbooks/${release}_site.yml"
            done
          done
      - name: Lint collections and playbooks
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/acme_oracle_control/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/acme_oracle_control/collections
        run: |
          ansible-lint acme_oracle_control/playbooks/19c_site.yml acme_oracle_control/playbooks/26ai_site.yml \
            acme_linux_baseline/roles acme_oracle_common/roles acme_oracle_19c/roles acme_oracle_26ai/roles --offline

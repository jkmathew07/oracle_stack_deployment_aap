---
- name: Require an approved release
  ansible.builtin.assert:
    that:
      - deployment_plan.release in ['19c', '26ai']
      - deployment_plan.release_cfg.SUPPORTED_OS is defined
      - deployment_plan.release_cfg.SUPPORTED_OS | length > 0
    fail_msg: >-
      Unsupported or unqualified release '{{ deployment_plan.release }}'.
      Each release's supported OS/version combinations are owned by
      config/releases/{{ deployment_plan.release }}.yml (SUPPORTED_OS).

- name: Require literal, absolute, release-fixed Oracle paths
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value is match('^/[A-Za-z0-9._/-]+$')
      - "'..' not in item.value"
    fail_msg: >-
      {{ item.key }}='{{ item.value }}' is not a literal absolute path. Oracle
      homes are fixed per release and patched in place; do not template them.
  loop: >-
    {{ deployment_plan.release_cfg | dict2items
       | selectattr('key', 'in', ['ORA_INVENTORY', 'GRID_HOME', 'GRID_BASE', 'DB_HOME', 'DB_BASE']) | list }}
  loop_control:
    label: "{{ item.key }}"

- name: Require the Grid home outside every Oracle base
  ansible.builtin.assert:
    that:
      - not (deployment_plan.release_cfg.GRID_HOME ~ '/').startswith(deployment_plan.release_cfg.GRID_BASE ~ '/')
      - not (deployment_plan.release_cfg.GRID_HOME ~ '/').startswith(deployment_plan.release_cfg.DB_BASE ~ '/')
    fail_msg: Oracle Restart requires GRID_HOME outside GRID_BASE and DB_BASE (root-owned path).

- name: Require homes resolved from RU_VERSION and never shared with a base
  ansible.builtin.assert:
    that:
      - ('/' ~ deployment_plan.release_cfg.RU_VERSION ~ '/') in deployment_plan.release_cfg.GRID_HOME
      - ('/' ~ deployment_plan.release_cfg.RU_VERSION ~ '/') in deployment_plan.release_cfg.DB_HOME
      - deployment_plan.release_cfg.GRID_HOME != deployment_plan.release_cfg.DB_HOME
      - not (deployment_plan.release_cfg.DB_HOME ~ '/').startswith(deployment_plan.release_cfg.GRID_HOME ~ '/')
    fail_msg: Oracle homes must be the RU_VERSION-resolved paths from node 00.

- name: Require an approved Linux combination for this release
  ansible.builtin.assert:
    that:
      - >-
        deployment_plan.release_cfg.SUPPORTED_OS
        | selectattr('distribution', 'equalto', ansible_facts.distribution)
        | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version)
        | list | length > 0
      - ansible_facts.memtotal_mb | int >= (deployment_plan.release_cfg.MIN_MEM_MB | default(16384) | int)
      - ansible_facts.processor_vcpus | int >= (deployment_plan.release_cfg.MIN_VCPU | default(2) | int)
      - ansible_facts.swaptotal_mb | int >= (deployment_plan.release_cfg.MIN_SWAP_MB | default(16384) | int)
      - ansible_facts.selinux.status | default('disabled') == 'enabled'
      - ansible_facts.selinux.mode | default('permissive') == 'enforcing'
    fail_msg: >-
      Unsupported or undersized host for {{ deployment_plan.release }} on
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }};
      qualify the OS/release combination and its security baseline first, or
      add it to SUPPORTED_OS in config/releases/{{ deployment_plan.release }}.yml.

- name: Read transparent hugepage setting
  ansible.builtin.slurp:
    src: /sys/kernel/mm/transparent_hugepage/enabled
  register: preflight_oracle_thp_state
  become: true

- name: Enforce preconfigured transparent hugepage policy
  ansible.builtin.assert:
    that: "'[' ~ 'never' ~ ']' in (preflight_oracle_thp_state.content | b64decode)"
    fail_msg: "THP must be disabled in the approved image before Oracle deployment."

- name: Determine minimum RU version required for this release on this OS major version
  ansible.builtin.set_fact:
    preflight_min_ru_version: >-
      {{ (deployment_plan.release_cfg.MIN_RU_VERSION_ON_MAJOR_VERSION | default({}))
         [ansible_facts.distribution_major_version] | default(0) | int }}

- name: Prevent unpatched installation where the release requires a minimum RU
  ansible.builtin.assert:
    that:
      - not deployment_plan.install_grid or deployment_plan.patch_grid
      - not deployment_plan.install_db or deployment_plan.patch_db
    fail_msg: >-
      A qualified RU must be selected for each newly installed
      {{ deployment_plan.release }} home on
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
      (see MIN_RU_VERSION_ON_MAJOR_VERSION in
      config/releases/{{ deployment_plan.release }}.yml).
  when: preflight_min_ru_version | int > 0

- name: Enforce the minimum RU version itself for this OS major version
  ansible.builtin.assert:
    that:
      - not deployment_plan.patch_grid or (deployment_plan.release_cfg.GRID_RU.ru_version | default(0) | int) >= (preflight_min_ru_version | int)
      - not deployment_plan.patch_db or (deployment_plan.release_cfg.DB_RU.ru_version | default(0) | int) >= (preflight_min_ru_version | int)
    fail_msg: >-
      {{ deployment_plan.release }} on
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
      requires a qualified RU at or above RU{{ preflight_min_ru_version }}
      (see MIN_RU_VERSION_ON_MAJOR_VERSION in
      config/releases/{{ deployment_plan.release }}.yml). Configured:
      GRID_RU=RU{{ deployment_plan.release_cfg.GRID_RU.ru_version | default('unset') }},
      DB_RU=RU{{ deployment_plan.release_cfg.DB_RU.ru_version | default('unset') }}.
  when: preflight_min_ru_version | int > 0

- name: Check requested Oracle media and patches on the managed host
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ deployment_plan.artifacts }}"
  loop_control:
    label: "{{ item.label }}"
  register: preflight_oracle_artifact_checks
  become: true

- name: Verify approved artifact hashes before any change
  ansible.builtin.assert:
    that:
      - item.item.sha256 is match('^[0-9a-f]{64}$')
      - item.stat.isreg | default(false)
      - item.stat.checksum | default('') == item.item.sha256
    fail_msg: "Missing or unapproved artifact: {{ item.item.label }}"
  loop: "{{ preflight_oracle_artifact_checks.results }}"
  loop_control:
    label: "{{ item.item.label }}"

# ── Locally-supplied packages (shared filesystem) ────────────────────────
# oracle_os_packages_local (playbooks/group_vars/all/os_packages.yml) is a
# flat, cross-release list of RPMs staged on a shared filesystem, keyed by
# OS major version + Oracle release. Filter it down to what applies to this
# host and this deployment, then verify each match's SHA-256 before
# configure_baseline is ever allowed to install it — exactly the same
# fail-closed contract as every other artifact checked above. No match is a
# normal, supported outcome (nothing to verify, nothing to install).
- name: Determine local packages applicable to this host and release
  ansible.builtin.set_fact:
    preflight_local_packages: >-
      {{ oracle_os_packages_local | default([])
         | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version)
         | selectattr('release', 'equalto', deployment_plan.release)
         | list }}

- name: Check locally-supplied packages on the managed host
  ansible.builtin.stat:
    path: "{{ oracle_os_packages_local_dir ~ item.filename }}"
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ preflight_local_packages }}"
  loop_control:
    label: "{{ item.filename }}"
  register: preflight_local_package_checks
  become: true
  when: preflight_local_packages | length > 0

- name: Verify locally-supplied package hashes before any change
  ansible.builtin.assert:
    that:
      - item.item.sha256 is match('^[0-9a-f]{64}$')
      - item.stat.isreg | default(false)
      - item.stat.checksum | default('') == item.item.sha256
    fail_msg: "Missing or unapproved local package: {{ item.item.filename }}"
  loop: "{{ preflight_local_package_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.filename }}"
  when: preflight_local_packages | length > 0

# ── Oracle Restart registration: only ONE Grid home can run HAS per host ──
# Installing Grid for a new RU on a host whose HAS runs from another home
# would reconfigure a live stack; moving HAS between homes (gridSetup.sh
# -switchGridHome) is a separate, reviewed change and is NOT automated here.
- name: Inspect Oracle Restart registration
  ansible.builtin.stat:
    path: /etc/oracle/olr.loc
  register: preflight_olr_loc_stat

- name: Read Oracle Restart registration
  ansible.builtin.slurp:
    src: /etc/oracle/olr.loc
  register: preflight_olr_loc
  when: preflight_olr_loc_stat.stat.exists
  become: true

- name: Determine the Grid home currently running Oracle Restart
  ansible.builtin.set_fact:
    preflight_configured_grid_home: >-
      {{ (preflight_olr_loc.content | default('') | b64decode
          | regex_findall('(?m)^crs_home=(\S+)\s*$') | first | default('')) | regex_replace('/+$', '') }}

- name: Refuse to touch Grid when HAS runs from a different home
  ansible.builtin.assert:
    that: >-
      not (deployment_plan.install_grid or deployment_plan.patch_grid)
      or preflight_configured_grid_home == ''
      or preflight_configured_grid_home == deployment_plan.release_cfg.GRID_HOME
    fail_msg: >-
      Oracle Restart runs from {{ preflight_configured_grid_home }}, not the RU_VERSION home
      {{ deployment_plan.release_cfg.GRID_HOME }}. Moving HAS to a new Grid home is a separate
      switchGridHome change and is not automated. Nothing was changed.

- name: Derive the RU of the configured Grid home from its RU-versioned path
  ansible.builtin.set_fact:
    preflight_configured_grid_ru: >-
      {{ preflight_configured_grid_home
         | regex_findall('^' ~ (deployment_plan.release_cfg.GRID_HOME_PATTERN
                                | replace('{RU_VERSION}', 'RUVERSIONTOKEN') | regex_escape
                                | replace('RUVERSIONTOKEN', '([0-9]{2}[.][0-9]{1,2}[.][0-9]{1,2})')) ~ '$')
         | first | default('') }}
  when:
    - deployment_plan.install_db
    - preflight_configured_grid_home != ''

- name: Require Grid at or above the RU of the new Database home
  ansible.builtin.assert:
    that:
      - preflight_configured_grid_ru | length > 0
      - preflight_configured_grid_ru is version(deployment_plan.release_cfg.RU_VERSION, '>=')
    fail_msg: >-
      The new DB home is RU {{ deployment_plan.release_cfg.RU_VERSION }} but Oracle Restart runs from
      {{ preflight_configured_grid_home }} (RU '{{ preflight_configured_grid_ru }}'). Grid must be at the
      same or a higher RU than any database home, and its RU must be readable from an RU-versioned path.
  when:
    - deployment_plan.install_db
    - preflight_configured_grid_home != ''

- name: Read Oracle inventory metadata
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: preflight_oracle_inventory_stat
  become: true

- name: Read registered Oracle homes
  ansible.builtin.slurp:
    src: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: preflight_oracle_inventory_xml
  when: preflight_oracle_inventory_stat.stat.exists
  become: true

- name: Check existing Grid and Database homes
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ deployment_plan.release_cfg.GRID_HOME }}"
    - "{{ deployment_plan.release_cfg.DB_HOME }}"
  register: preflight_oracle_home_checks
  become: true

- name: Fail closed on partial installs and absent patch targets
  ansible.builtin.assert:
    that:
      - not deployment_plan.install_grid or not preflight_oracle_home_checks.results[0].stat.exists or grid_registered
      - not deployment_plan.install_db or not preflight_oracle_home_checks.results[1].stat.exists or db_registered
      - not deployment_plan.patch_grid or deployment_plan.install_grid or grid_registered
      - not deployment_plan.patch_db or deployment_plan.install_db or db_registered
    fail_msg: >-
      Existing unregistered home, or patch-only requested for a home that does not exist.
      Homes are RU-versioned: to move to RU {{ deployment_plan.release_cfg.RU_VERSION }}, install the
      new home (install + patch scope) instead of patching an older home. Investigate and recover manually.
  vars:
    grid_registered: "{{ 'LOC=\"' ~ deployment_plan.release_cfg.GRID_HOME ~ '\"' in (preflight_oracle_inventory_xml.content | default('') | b64decode) }}"
    db_registered: "{{ 'LOC=\"' ~ deployment_plan.release_cfg.DB_HOME ~ '\"' in (preflight_oracle_inventory_xml.content | default('') | b64decode) }}"

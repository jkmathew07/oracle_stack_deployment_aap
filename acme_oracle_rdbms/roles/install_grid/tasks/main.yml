---
- name: Inspect current Grid registration
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_grid_grid_inventory_stat
  become: true
  when: deployment_plan.install_grid

- name: Read Grid registration
  ansible.builtin.slurp:
    src: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_grid_grid_inventory_xml
  become: true
  when: deployment_plan.install_grid and install_grid_grid_inventory_stat.stat.exists

- name: Compute whether Grid install is needed
  ansible.builtin.set_fact:
    install_grid_grid_install_needed: >-
      {{ deployment_plan.install_grid and ('LOC="' ~ deployment_plan.release_cfg.GRID_HOME ~ '"' not in
      (install_grid_grid_inventory_xml.content | default('') | b64decode)) }}

- name: Install Grid software and configure Oracle Restart
  when: install_grid_grid_install_needed
  become: true
  block:
    - name: Create Oracle directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: oinstall
        mode: '0775'
        state: directory
      loop:
        - {path: "{{ deployment_plan.release_cfg.GRID_HOME }}", owner: grid}
        - {path: "{{ deployment_plan.release_cfg.GRID_BASE }}", owner: grid}
        - {path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}", owner: grid}

    - name: Unpack approved Grid image on target
      ansible.builtin.unarchive:
        src: "{{ deployment_plan.release_cfg.GRID_MEDIA.path }}"
        dest: "{{ deployment_plan.release_cfg.GRID_HOME }}"
        remote_src: true
        creates: "{{ deployment_plan.release_cfg.GRID_HOME }}/gridSetup.sh"
        owner: grid
        group: oinstall

    - name: Write Grid response file
      ansible.builtin.template:
        src: grid.rsp.j2
        dest: "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
        owner: grid
        group: oinstall
        mode: '0600'
      no_log: true

    - name: Update OPatch before RU installation
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.update_opatch
      vars:
        opatch_home: "{{ deployment_plan.release_cfg.GRID_HOME }}"
        opatch_owner: grid
      when: deployment_plan.patch_grid

    - name: Stage approved Grid RU before installer uses it
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.stage_patch
      vars:
        patch_data: "{{ deployment_plan.release_cfg.GRID_RU }}"
        patch_owner: grid
      when: deployment_plan.patch_grid

    - name: Install Grid with the approved RU
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/gridSetup.sh"
          - -silent
          - -responseFile
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
          - -applyRU
          - "{{ deployment_plan.release_cfg.GRID_RU.dir }}"
          - -waitforcompletion
      become: true
      become_user: grid
      changed_when: true
      async: 7200
      poll: 30
      when: deployment_plan.patch_grid
      register: install_grid_grid_setup_with_ru

    - name: Install Grid without an RU on an approved EL8 host
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/gridSetup.sh"
          - -silent
          - -responseFile
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
          - -waitforcompletion
      become: true
      become_user: grid
      changed_when: true
      async: 7200
      poll: 30
      when: not deployment_plan.patch_grid

    - name: Run inventory root script
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.ORA_INVENTORY }}/orainstRoot.sh"]
      changed_when: true
      when: not install_grid_grid_inventory_stat.stat.exists

    - name: Run Grid root script
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/root.sh"]
      changed_when: true
      async: 3600
      poll: 30

    - name: Configure Oracle Restart
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/crs/install/roothas.sh"]
      changed_when: true
      async: 3600
      poll: 30

- name: Verify Oracle Restart service after requested installation
  ansible.builtin.command:
    argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/bin/crsctl", check, has]
  changed_when: false
  become: true
  when: deployment_plan.install_grid

- name: Publish Grid install-time RU state
  ansible.builtin.set_stats:
    data:
      grid_ru_installed_at_install: "{{ install_grid_grid_install_needed and deployment_plan.patch_grid }}"
  when: deployment_plan.install_grid

---
# =============================================================================
# patch_db_oneoffs - interim (one-off) patches on top of the DB RU.
#
# A patch whose conflict check fails is skipped with a warning (home
# unchanged) and published as db_interim_skipped. A failure during apply
# fails the job. Databases on the home are already required down by
# patch_db. No-ops when DB_INTERIM_PATCHES is empty (the shipped default).
# =============================================================================

- name: Apply requested DB interim patches
  when:
    - deployment_plan.patch_db
    - deployment_plan.release_cfg.DB_INTERIM_PATCHES | default([]) | length > 0
  become: true
  block:
    - name: Confirm DB home is present
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch"
      register: patch_db_oneoffs_db_opatch

    - name: Fail when DB home is unavailable
      ansible.builtin.assert:
        that: patch_db_oneoffs_db_opatch.stat.exists | default(false)

    - name: Update OPatch from approved archive
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.update_opatch
      vars:
        opatch_home: "{{ deployment_plan.release_cfg.DB_HOME }}"
        opatch_owner: oracle

    - name: List installed DB patches before interim patching
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch", lspatches]
      changed_when: false
      register: patch_db_oneoffs_patches_before
      become: true
      become_user: oracle

    - name: Apply each approved DB interim patch
      ansible.builtin.include_tasks: apply_one_interim_patch.yml
      loop: "{{ deployment_plan.release_cfg.DB_INTERIM_PATCHES }}"
      loop_control:
        loop_var: oneoff_item
        label: "{{ oneoff_item.label | default(oneoff_item.id) }}"

    - name: Read final DB OPatch inventory
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch", lspatches]
      changed_when: false
      become: true
      become_user: oracle
      register: patch_db_oneoffs_patches_after

    - name: Require every non-skipped interim patch to be installed
      ansible.builtin.assert:
        that: >-
          deployment_plan.release_cfg.DB_INTERIM_PATCHES | map(attribute='id')
          | difference(patch_db_oneoffs_skipped | default([]) | map(attribute='id'))
          | difference(patch_db_oneoffs_patches_after.stdout | regex_findall('(?m)^([0-9]{5,10});'))
          | length == 0
        fail_msg: A DB interim patch reported success but is missing from the OPatch inventory.

    - name: Publish skipped DB interim patches
      ansible.builtin.set_stats:
        per_host: false
        data:
          db_interim_skipped: "{{ patch_db_oneoffs_skipped | default([]) }}"

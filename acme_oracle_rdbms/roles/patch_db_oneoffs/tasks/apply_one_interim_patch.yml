---
# Included once per entry in DB_INTERIM_PATCHES, with oneoff_item and
# patch_db_oneoffs_patches_before set by the caller. A block CAN'T carry
# loop: directly in Ansible, so the per-item block/rescue lives here and
# main.yml loops over this file with include_tasks instead.

- name: "Apply DB interim patch: {{ oneoff_item.label | default(oneoff_item.id) }}"
  when: oneoff_item.id not in (patch_db_oneoffs_patches_before.stdout | regex_findall('(?m)^([0-9]{5,10});'))
  block:
    - name: Stage this interim patch
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.stage_patch
      vars:
        patch_data: "{{ oneoff_item }}"
        patch_owner: oracle

    - name: Apply this interim patch via opatch
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch", apply, "{{ oneoff_item.dir }}", -silent]
      changed_when: true
      become: true
      become_user: oracle
  rescue:
    - name: "Warn — interim patch error treated as non-fatal"
      ansible.builtin.debug:
        msg: >-
          WARNING — DB interim patch '{{ oneoff_item.label | default(oneoff_item.id) }}'
          failed or conflicted; the DB home remains valid at the RU level.
          Review manually: {{ ansible_failed_result.msg | default('see output above') | truncate(300) }}

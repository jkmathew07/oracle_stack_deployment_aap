---
# Included once per DB_INTERIM_PATCHES entry (oneoff_item), after
# patch_db_oneoffs_patches_before is set by main.yml. Same failure policy as
# patch_grid_oneoffs: a conflict found by the prereq check is skipped with a
# warning (home unchanged); a failure during apply fails the job.
- name: "DB interim patch: {{ oneoff_item.label | default(oneoff_item.id) }}"
  when: oneoff_item.id not in (patch_db_oneoffs_patches_before.stdout | regex_findall('(?m)^([0-9]{5,10});'))
  block:
    - name: Stage this interim patch
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.stage_patch
      vars:
        patch_data: "{{ oneoff_item }}"
        patch_owner: oracle

    - name: Check this interim patch for conflicts (no change to the home)
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch"
          - prereq
          - CheckConflictAgainstOHWithDetail
          - -ph
          - "{{ oneoff_item.dir }}"
          - -oh
          - "{{ deployment_plan.release_cfg.DB_HOME }}"
      become: true
      become_user: oracle
      changed_when: false
      failed_when: false
      register: patch_db_oneoffs_prereq

    - name: Warn and skip - conflict or prerequisite failure (home unchanged)
      ansible.builtin.set_fact:
        patch_db_oneoffs_skipped: >-
          {{ patch_db_oneoffs_skipped | default([]) +
             [{'id': oneoff_item.id, 'label': oneoff_item.label | default(oneoff_item.id),
               'reason': 'opatch prereq rc=' ~ patch_db_oneoffs_prereq.rc}] }}
      when: patch_db_oneoffs_prereq.rc != 0

    - name: Report the skipped interim patch
      ansible.builtin.debug:
        msg: >-
          WARNING - DB interim patch '{{ oneoff_item.label | default(oneoff_item.id) }}' NOT applied:
          opatch prereq failed (rc={{ patch_db_oneoffs_prereq.rc }}). Home unchanged at RU level.
          {{ (patch_db_oneoffs_prereq.stdout_lines | default([]))[-15:] | join(' | ') }}
      when: patch_db_oneoffs_prereq.rc != 0

    - name: Apply this interim patch with opatch
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch"
          - apply
          - -silent
          - -oh
          - "{{ deployment_plan.release_cfg.DB_HOME }}"
          - "{{ oneoff_item.dir }}"
      become: true
      become_user: oracle
      changed_when: true
      async: 3600
      poll: 30
      when: patch_db_oneoffs_prereq.rc == 0

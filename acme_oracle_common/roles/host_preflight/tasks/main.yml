---
# =============================================================================
# host_preflight - release-agnostic checks on the target, before ANY change.
# Release-specific rules (e.g. 19c minimum RU per EL version) live in the
# release collection's own preflight role, which runs right after this one.
# =============================================================================
- name: Require the plan's release to match the release file it was built from
  ansible.builtin.assert:
    that:
      - deployment_plan.release in ['19c', '26ai']
      - deployment_plan.release_cfg.RELEASE | default('') == deployment_plan.release
      - deployment_plan.release_cfg.SUPPORTED_OS is defined
      - deployment_plan.release_cfg.SUPPORTED_OS | length > 0
    fail_msg: >-
      Unsupported or unqualified release '{{ deployment_plan.release }}'.
      Each release's supported OS/version combinations are owned by
      config/releases/{{ deployment_plan.release }}.yml (SUPPORTED_OS).

- name: Require literal absolute Oracle paths
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value is match('^/[A-Za-z0-9._/-]+$')
      - "'..' not in item.value"
    fail_msg: >-
      {{ item.key }}='{{ item.value }}' is not a literal absolute path after
      RU_VERSION resolution.
  loop: >-
    {{ deployment_plan.release_cfg | dict2items
       | selectattr('key', 'in', ['ORA_INVENTORY', 'GRID_HOME', 'GRID_BASE', 'DB_HOME', 'DB_BASE']) | list }}
  loop_control:
    label: "{{ item.key }}"

- name: Require the Grid home outside every Oracle base
  ansible.builtin.assert:
    that:
      - not (deployment_plan.release_cfg.GRID_HOME ~ '/').startswith(deployment_plan.release_cfg.GRID_BASE ~ '/')
      - not (deployment_plan.release_cfg.GRID_HOME ~ '/').startswith(deployment_plan.release_cfg.DB_BASE ~ '/')
    fail_msg: Oracle Restart requires GRID_HOME outside GRID_BASE and DB_BASE (root-owned path).

- name: Require homes resolved from RU_VERSION and never shared with a base
  ansible.builtin.assert:
    that:
      - ('/' ~ deployment_plan.release_cfg.RU_VERSION ~ '/') in deployment_plan.release_cfg.GRID_HOME
      - ('/' ~ deployment_plan.release_cfg.RU_VERSION ~ '/') in deployment_plan.release_cfg.DB_HOME
      - deployment_plan.release_cfg.GRID_HOME != deployment_plan.release_cfg.DB_HOME
      - not (deployment_plan.release_cfg.DB_HOME ~ '/').startswith(deployment_plan.release_cfg.GRID_HOME ~ '/')
    fail_msg: Oracle homes must be the RU_VERSION-resolved paths from node 00.

# One check per rule, each naming the actual and required value.
- name: Require an OS/version certified for this release
  ansible.builtin.assert:
    that: >-
      deployment_plan.release_cfg.SUPPORTED_OS
      | selectattr('distribution', 'equalto', ansible_facts.distribution)
      | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version)
      | list | length > 0
    fail_msg: >-
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }} is not in SUPPORTED_OS
      for {{ deployment_plan.release }} ({{ deployment_plan.release_cfg.SUPPORTED_OS
      | map(attribute='distribution') | zip(deployment_plan.release_cfg.SUPPORTED_OS | map(attribute='major_version'))
      | map('join', ' ') | join(', ') }}). Add it to config/releases/{{ deployment_plan.release }}.yml only
      once Oracle certifies it.

- name: Require enough memory
  ansible.builtin.assert:
    that: ansible_facts.memtotal_mb | int >= (deployment_plan.release_cfg.MIN_MEM_MB | default(16384) | int)
    fail_msg: >-
      Memory {{ ansible_facts.memtotal_mb }} MB is below MIN_MEM_MB
      {{ deployment_plan.release_cfg.MIN_MEM_MB | default(16384) }} MB.

- name: Require enough vCPUs
  ansible.builtin.assert:
    that: ansible_facts.processor_vcpus | int >= (deployment_plan.release_cfg.MIN_VCPU | default(2) | int)
    fail_msg: >-
      {{ ansible_facts.processor_vcpus }} vCPU is below MIN_VCPU {{ deployment_plan.release_cfg.MIN_VCPU | default(2) }}.

- name: Require enough swap
  ansible.builtin.assert:
    that: ansible_facts.swaptotal_mb | int >= (deployment_plan.release_cfg.MIN_SWAP_MB | default(16000) | int)
    fail_msg: >-
      Swap {{ ansible_facts.swaptotal_mb }} MB is below MIN_SWAP_MB
      {{ deployment_plan.release_cfg.MIN_SWAP_MB | default(16000) }} MB
      (RAM {{ ansible_facts.memtotal_mb }} MB). Add swap on the host, or lower MIN_SWAP_MB in
      config/releases/{{ deployment_plan.release }}.yml to your Oracle-sized value.

- name: Require SELinux enforcing (security baseline)
  ansible.builtin.assert:
    that:
      - ansible_facts.selinux.status | default('disabled') == 'enabled'
      - ansible_facts.selinux.mode | default('permissive') == 'enforcing'
    fail_msg: >-
      SELinux is {{ ansible_facts.selinux.status | default('unknown') }}/{{ ansible_facts.selinux.mode | default('unknown') }};
      the approved baseline requires enabled/enforcing.

# THP is configured by acme.oracle_common.configure_thp in the baseline stage
# (after this preflight), so it is only reported here, never enforced.
- name: Read transparent hugepage setting
  ansible.builtin.slurp:
    src: /sys/kernel/mm/transparent_hugepage/enabled
  register: host_preflight_oracle_thp_state
  become: true

- name: Report current THP setting (configured in the baseline stage)
  ansible.builtin.debug:
    msg: >-
      THP is currently '{{ host_preflight_oracle_thp_state.content | b64decode | trim }}';
      the baseline stage sets it to [{{ deployment_plan.release_cfg.THP_MODE | default('madvise') }}].

# ── Oracle media integrity (SHA-256 optional) ────────────────────────────
# Media comes from Oracle Support. An artifact with a sha256 in the release
# file is verified against it (use the value from the MOS download page); an
# empty sha256 means "not pinned" and the archive is instead tested for
# completeness (python zipfile CRC test), which catches truncated/corrupt copies.
# Either way a malformed sha256 (e.g. a placeholder) fails closed.
- name: Inspect requested Oracle media on the managed host
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.sha256 | default('', true) | length > 0 }}"
    checksum_algorithm: sha256
  loop: "{{ deployment_plan.artifacts }}"
  loop_control:
    label: "{{ item.label }}"
  register: host_preflight_artifacts
  become: true

- name: Require present media and, where pinned, a matching SHA-256
  ansible.builtin.assert:
    that:
      - item.item.path is match('^/[A-Za-z0-9._/-]+[.]zip$')
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) > 0
      - (item.item.sha256 | default('', true)) == '' or (item.item.sha256 is match('^[0-9a-f]{64}$'))
      - (item.item.sha256 | default('', true)) == '' or (item.stat.checksum | default('') == item.item.sha256)
    fail_msg: >-
      {{ item.item.label }} ({{ item.item.path }}) is missing, empty, or does not match its pinned
      SHA-256. Leave sha256 empty to skip pinning, or paste the value from the Oracle Support download page.
  loop: "{{ host_preflight_artifacts.results }}"
  loop_control:
    label: "{{ item.item.label }}"

# Uses the target's Python (always present for Ansible) instead of unzip,
# which the baseline installs only AFTER this preflight. Reads every member
# and checks its CRC; a truncated archive fails to open, a damaged member is
# reported as corrupted.
- name: Test completeness of unpinned media archives
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable | default('/usr/bin/python3') }}", -m, zipfile, -t, "{{ item.item.path }}"]
  register: host_preflight_zip_test
  changed_when: false
  failed_when: host_preflight_zip_test.rc != 0 or 'corrupted' in host_preflight_zip_test.stdout
  loop: "{{ host_preflight_artifacts.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: (item.item.sha256 | default('', true)) == ''
  become: true

# ── Locally staged Oracle RPMs (RHEL has no Oracle repo) ─────────────────
- name: Determine local packages applicable to this host and release
  ansible.builtin.set_fact:
    host_preflight_local_packages: >-
      {{ oracle_os_packages_local | default([])
         | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version)
         | selectattr('release', 'equalto', deployment_plan.release)
         | list }}

- name: Inspect locally staged packages
  ansible.builtin.stat:
    path: "{{ oracle_os_packages_local_dir ~ item.filename }}"
    get_checksum: "{{ item.sha256 | default('', true) | length > 0 }}"
    checksum_algorithm: sha256
  loop: "{{ host_preflight_local_packages }}"
  loop_control:
    label: "{{ item.filename }}"
  register: host_preflight_local_package_checks
  become: true

- name: Require present packages and, where pinned, a matching SHA-256
  ansible.builtin.assert:
    that:
      - item.item.filename is match('^[A-Za-z0-9._+-]+[.]rpm$')
      - item.stat.isreg | default(false)
      - (item.item.sha256 | default('', true)) == '' or (item.item.sha256 is match('^[0-9a-f]{64}$'))
      - (item.item.sha256 | default('', true)) == '' or (item.stat.checksum | default('') == item.item.sha256)
    fail_msg: "Missing, or not matching its pinned SHA-256: {{ item.item.filename }}"
  loop: "{{ host_preflight_local_package_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.filename }}"

- name: Verify RPM internal digests of locally staged packages
  ansible.builtin.command:
    argv: [rpm, -K, --nosignature, "{{ oracle_os_packages_local_dir ~ item.filename }}"]
  changed_when: false
  loop: "{{ host_preflight_local_packages }}"
  loop_control:
    label: "{{ item.filename }}"
  become: true

# would reconfigure a live stack; moving HAS between homes (gridSetup.sh
# -switchGridHome) is a separate, reviewed change and is NOT automated here.
- name: Inspect Oracle Restart registration
  ansible.builtin.stat:
    path: /etc/oracle/olr.loc
  register: host_preflight_olr_loc_stat

- name: Read Oracle Restart registration
  ansible.builtin.slurp:
    src: /etc/oracle/olr.loc
  register: host_preflight_olr_loc
  when: host_preflight_olr_loc_stat.stat.exists
  become: true

- name: Determine the Grid home currently running Oracle Restart
  ansible.builtin.set_fact:
    host_preflight_configured_grid_home: >-
      {{ (host_preflight_olr_loc.content | default('') | b64decode
          | regex_findall('(?m)^crs_home=(\S+)\s*$') | first | default('')) | regex_replace('/+$', '') }}

- name: Refuse to touch Grid when HAS runs from a different home
  ansible.builtin.assert:
    that: >-
      not (deployment_plan.install_grid or (deployment_plan.patch_grid | default(false)))
      or host_preflight_configured_grid_home == ''
      or host_preflight_configured_grid_home == deployment_plan.release_cfg.GRID_HOME
    fail_msg: >-
      Oracle Restart runs from {{ host_preflight_configured_grid_home }}, not the RU_VERSION home
      {{ deployment_plan.release_cfg.GRID_HOME }}. Moving HAS to a new Grid home is a separate
      switchGridHome change and is not automated. Nothing was changed.

- name: Derive the RU of the configured Grid home from its RU-versioned path
  ansible.builtin.set_fact:
    host_preflight_configured_grid_ru: >-
      {{ host_preflight_configured_grid_home
         | regex_findall('^' ~ (deployment_plan.release_cfg.GRID_HOME_PATTERN
                                | replace('{RU_VERSION}', 'RUVERSIONTOKEN') | regex_escape
                                | replace('RUVERSIONTOKEN', '([0-9]{2}[.][0-9]{1,2}[.][0-9]{1,2})')) ~ '$')
         | first | default('') }}
  when:
    - deployment_plan.install_db
    - host_preflight_configured_grid_home != ''

- name: Require Grid at or above the RU of the new Database home
  ansible.builtin.assert:
    that:
      - host_preflight_configured_grid_ru | length > 0
      - host_preflight_configured_grid_ru is version(deployment_plan.release_cfg.RU_VERSION, '>=')
    fail_msg: >-
      The new DB home is RU {{ deployment_plan.release_cfg.RU_VERSION }} but Oracle Restart runs from
      {{ host_preflight_configured_grid_home }} (RU '{{ host_preflight_configured_grid_ru }}'). Grid must be at the
      same or a higher RU than any database home, and its RU must be readable from an RU-versioned path.
  when:
    - deployment_plan.install_db
    - host_preflight_configured_grid_home != ''

- name: Read Oracle inventory metadata
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: host_preflight_oracle_inventory_stat
  become: true

- name: Read registered Oracle homes
  ansible.builtin.slurp:
    src: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: host_preflight_oracle_inventory_xml
  when: host_preflight_oracle_inventory_stat.stat.exists
  become: true

- name: Check existing Grid and Database homes
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ deployment_plan.release_cfg.GRID_HOME }}"
    - "{{ deployment_plan.release_cfg.DB_HOME }}"
  register: host_preflight_oracle_home_checks
  become: true

- name: Fail closed on partial installs and absent patch targets
  ansible.builtin.assert:
    that:
      - not deployment_plan.install_grid or not host_preflight_oracle_home_checks.results[0].stat.exists or grid_registered
      - not deployment_plan.install_db or not host_preflight_oracle_home_checks.results[1].stat.exists or db_registered
      - not (deployment_plan.patch_grid | default(false)) or deployment_plan.install_grid or grid_registered
      - not (deployment_plan.patch_db | default(false)) or deployment_plan.install_db or db_registered
    fail_msg: >-
      Existing unregistered home, or patch-only requested for a home that does not exist.
      Homes are RU-versioned: to move to RU {{ deployment_plan.release_cfg.RU_VERSION }}, install the
      new home (install + patch scope) instead of patching an older home. Investigate and recover manually.
  vars:
    grid_registered: "{{ 'LOC=\"' ~ deployment_plan.release_cfg.GRID_HOME ~ '\"' in (host_preflight_oracle_inventory_xml.content | default('') | b64decode) }}"
    db_registered: "{{ 'LOC=\"' ~ deployment_plan.release_cfg.DB_HOME ~ '\"' in (host_preflight_oracle_inventory_xml.content | default('') | b64decode) }}"

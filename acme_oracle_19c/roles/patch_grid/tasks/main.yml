---
# =============================================================================
# patch_grid - RU verification for an RU-versioned Grid home.
#
# Homes are out-of-place: the RU is applied only at install time
# (gridSetup.sh -applyRU into /u01/app/<RU_VERSION>/grid). This role never
# applies an RU in place, because that would make the home path lie about the
# RU inside it. It prepares OPatch for interim patches and FAILS CLOSED if the
# home does not carry the RU its path names.
# =============================================================================
- name: Verify Grid RU of the RU-versioned home
  when: deployment_plan.patch_grid
  become: true
  block:
    - name: Confirm Grid home is present
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.GRID_HOME }}/OPatch/opatch"
      register: patch_grid_grid_opatch

    - name: Fail when Grid home is unavailable
      ansible.builtin.assert:
        that: patch_grid_grid_opatch.stat.exists | default(false)
        fail_msg: >-
          {{ deployment_plan.release_cfg.GRID_HOME }} does not exist. A new RU is installed as a new
          home (install_grid + patch scope), never patched into an older home.

    - name: Update OPatch from approved archive
      ansible.builtin.include_role:
        name: acme.oracle_19c.update_opatch
      vars:
        opatch_home: "{{ deployment_plan.release_cfg.GRID_HOME }}"
        opatch_owner: grid

    - name: List installed Grid patches
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/OPatch/opatch", lspatches]
      changed_when: false
      register: patch_grid_grid_patches
      become: true
      become_user: grid

    - name: Require the home to carry the RU named in its path
      ansible.builtin.assert:
        that: >-
          deployment_plan.release_cfg.GRID_RU.expected_patch_ids | difference(patch_grid_grid_patches.stdout |
          regex_findall('(?m)^([0-9]{5,10});')) | length == 0
        fail_msg: >-
          {{ deployment_plan.release_cfg.GRID_HOME }} is named for RU {{ deployment_plan.release_cfg.RU_VERSION }}
          but lacks its RU patches. In-place RU patching is not allowed for RU-versioned homes; investigate
          how this home was built.

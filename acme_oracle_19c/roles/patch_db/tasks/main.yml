---
# =============================================================================
# patch_db - RU verification for an RU-versioned Database home.
#
# Homes are out-of-place: the RU is applied only at install time
# (runInstaller -applyRU into .../product/<RU_VERSION>/...). Databases keep
# running from their current home and are moved to the new home (plus
# datapatch) under their own change. This role never applies an RU in place;
# it prepares OPatch for interim patches and FAILS CLOSED if the home does not
# carry the RU its path names.
# =============================================================================
- name: Verify DB RU of the RU-versioned home
  when: deployment_plan.patch_db
  become: true
  block:
    - name: Confirm DB Home is present
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch"
      register: patch_db_db_opatch

    - name: Fail when DB Home is unavailable
      ansible.builtin.assert:
        that: patch_db_db_opatch.stat.exists | default(false)
        fail_msg: >-
          {{ deployment_plan.release_cfg.DB_HOME }} does not exist. A new RU is installed as a new
          home (install_db_home + patch scope), never patched into an older home.

    - name: Update OPatch from approved archive
      ansible.builtin.include_role:
        name: acme.oracle_19c.update_opatch
      vars:
        opatch_home: "{{ deployment_plan.release_cfg.DB_HOME }}"
        opatch_owner: oracle

    - name: List installed DB Home patches
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.DB_HOME }}/OPatch/opatch", lspatches]
      changed_when: false
      become: true
      become_user: oracle
      register: patch_db_db_patches

    - name: Require the home to carry the RU named in its path
      ansible.builtin.assert:
        that: >-
          deployment_plan.release_cfg.DB_RU.expected_patch_ids | difference(patch_db_db_patches.stdout |
          regex_findall('(?m)^([0-9]{5,10});')) | length == 0
        fail_msg: >-
          {{ deployment_plan.release_cfg.DB_HOME }} is named for RU {{ deployment_plan.release_cfg.RU_VERSION }}
          but lacks its RU patches. In-place RU patching is not allowed for RU-versioned homes; investigate
          how this home was built.

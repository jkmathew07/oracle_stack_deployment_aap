---
# =============================================================================
# install_db (26ai) - Database software-only home from the Oracle-patched DB
# gold image into .../product/<RU_VERSION>/oracle. No OPatch/RU steps.
# Supports DB-only hosts (creates/registers the central inventory).
# =============================================================================
- name: Inspect current DB Home registration
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_db_inventory_stat
  become: true
  when: deployment_plan.install_db

- name: Read DB Home registration
  ansible.builtin.slurp:
    src: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_db_inventory_xml
  become: true
  when: deployment_plan.install_db and install_db_inventory_stat.stat.exists

- name: Compute whether DB Home install is needed
  ansible.builtin.set_fact:
    install_db_install_needed: >-
      {{ deployment_plan.install_db and ('LOC="' ~ deployment_plan.release_cfg.DB_HOME ~ '"' not in
      (install_db_inventory_xml.content | default('') | b64decode)) }}

- name: Install Oracle Database software
  become: true
  when: install_db_install_needed
  block:
    # DB-only installs (no Grid) run on hosts where nothing has created the
    # OFA root or the central inventory yet. Only create what is missing so
    # an existing site layout (e.g. /u01/app owned by grid) is never changed.
    - name: Inspect the Oracle software root
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.ORA_INVENTORY | dirname }}"
      register: install_db_software_root

    - name: Create the Oracle software root when missing
      ansible.builtin.file:
        path: "{{ deployment_plan.release_cfg.ORA_INVENTORY | dirname }}"
        owner: root
        group: oinstall
        mode: '0775'
        state: directory
      when: not install_db_software_root.stat.exists

    - name: Create the central inventory when no Oracle software exists yet
      ansible.builtin.file:
        path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}"
        owner: oracle
        group: oinstall
        mode: '0770'
        state: directory
      when: not install_db_inventory_stat.stat.exists

    # Base first: creating the home first would create the base implicitly.
    - name: Create Oracle base and home
      ansible.builtin.file:
        path: "{{ item }}"
        owner: oracle
        group: oinstall
        state: directory
        mode: '0775'
      loop:
        - "{{ deployment_plan.release_cfg.DB_BASE }}"
        - "{{ deployment_plan.release_cfg.DB_HOME }}"

    - name: Unpack the Database gold image
      ansible.builtin.unarchive:
        src: "{{ deployment_plan.release_cfg.DB_IMAGE.path }}"
        dest: "{{ deployment_plan.release_cfg.DB_HOME }}"
        remote_src: true
        creates: "{{ deployment_plan.release_cfg.DB_HOME }}/runInstaller"
        owner: oracle
        group: oinstall

    - name: Write Database response file
      ansible.builtin.template:
        src: db.rsp.j2
        dest: "{{ deployment_plan.release_cfg.DB_HOME }}/db.rsp"
        owner: oracle
        group: oinstall
        mode: '0600'
      no_log: true

    # Fail with a clear message (before the installer runs) if this image's
    # shipped template does not know one of our keys - e.g. a future image
    # renames them. Skipped with a warning if the image ships no template.
    - name: Inspect the response-file template shipped in the DB image
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.DB_HOME }}/install/response/db_install.rsp"
      register: install_db_shipped_rsp_stat

    - name: Read the shipped template and our response file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ deployment_plan.release_cfg.DB_HOME }}/install/response/db_install.rsp"
        - "{{ deployment_plan.release_cfg.DB_HOME }}/db.rsp"
      register: install_db_rsp_files
      no_log: true
      when: install_db_shipped_rsp_stat.stat.exists

    - name: Require every key we set to exist in the image's template
      ansible.builtin.assert:
        that: install_db_rsp_unknown_keys | length == 0
        fail_msg: >-
          {{ deployment_plan.release_cfg.DB_HOME }}/db.rsp uses keys this image's db_install.rsp
          does not define: {{ install_db_rsp_unknown_keys | join(', ') }}. Update db.rsp.j2 in acme.oracle_26ai.
      vars:
        install_db_rsp_unknown_keys: >-
          {{ (install_db_rsp_files.results[1].content | b64decode
                | regex_findall('(?m)^([A-Za-z_.]+)='))
             | difference(install_db_rsp_files.results[0].content | b64decode
                | regex_findall('(?m)^([A-Za-z_.]+)=')) }}
      when: install_db_shipped_rsp_stat.stat.exists

    - name: Warn that the shipped template could not be compared
      ansible.builtin.debug:
        msg: "No install/response/db_install.rsp in the DB image; response-file keys not pre-checked."
      when: not install_db_shipped_rsp_stat.stat.exists

    # rc 6 = success with IGNORABLE prerequisite warnings; accepted only
    # together with the installer's success line.
    - name: Install DB software from the gold image
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.DB_HOME }}/runInstaller"
          - -silent
          - -responseFile
          - "{{ deployment_plan.release_cfg.DB_HOME }}/db.rsp"
          - -waitForCompletion
      become: true
      become_user: oracle
      register: install_db_setup
      changed_when: true
      failed_when: >-
        install_db_setup.rc not in [0, 6]
        or 'Successfully Setup Software' not in (install_db_setup.stdout | default(''))
      async: 7200
      poll: 30

    - name: Show installer warnings (rc 6)
      ansible.builtin.debug:
        msg: "{{ install_db_setup.stdout_lines | select('search', 'PRV|INS-|Error message') | list }}"
      when: install_db_setup.rc | default(0) == 6

# ── Root scripts, driven by host state so an interrupted run is completed ──
- name: Run DB home root configuration where not yet done
  when: deployment_plan.install_db
  become: true
  block:
    - name: Inspect central inventory registration (/etc/oraInst.loc)
      ansible.builtin.stat:
        path: /etc/oraInst.loc
      register: install_db_orainst_loc

    - name: Register the central inventory (first Oracle install on host)
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.ORA_INVENTORY }}/orainstRoot.sh"]
      changed_when: true
      when: not install_db_orainst_loc.stat.exists

    - name: Inspect DB home root-script marker
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.DB_HOME }}/.automation-root-sh-done"
      register: install_db_root_marker

    - name: Run DB Home root script
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.DB_HOME }}/root.sh"]
      changed_when: true
      async: 1800
      poll: 30
      when: not install_db_root_marker.stat.exists

    - name: Record that root.sh completed for this home
      ansible.builtin.copy:
        dest: "{{ deployment_plan.release_cfg.DB_HOME }}/.automation-root-sh-done"
        content: "root.sh completed by Oracle automation\n"
        owner: root
        group: root
        mode: '0644'
      when: not install_db_root_marker.stat.exists

- name: Verify Database executable exists
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.DB_HOME }}/bin/oracle"
  register: install_db_oracle_binary
  become: true
  when: deployment_plan.install_db

- name: Assert DB Home installation completed
  ansible.builtin.assert:
    that: install_db_oracle_binary.stat.exists | default(false)
  when: deployment_plan.install_db

- name: Verify the DB home holds the image version its path names
  ansible.builtin.include_role:
    name: acme.oracle_26ai.verify_home
  vars:
    verify_home_path: "{{ deployment_plan.release_cfg.DB_HOME }}"
    verify_home_owner: oracle
  when: deployment_plan.install_db

---
# =============================================================================
# install_grid (26ai) - Oracle Restart from the Oracle-patched Grid gold image
# into /u01/app/<RU_VERSION>/grid. No OPatch/RU steps: the image is already
# patched. acme.oracle_common.host_preflight has already refused this if
# Oracle Restart runs from another home.
# =============================================================================
- name: Inspect current Grid registration
  ansible.builtin.stat:
    path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_grid_inventory_stat
  become: true
  when: deployment_plan.install_grid

- name: Read Grid registration
  ansible.builtin.slurp:
    src: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}/ContentsXML/inventory.xml"
  register: install_grid_inventory_xml
  become: true
  when: deployment_plan.install_grid and install_grid_inventory_stat.stat.exists

- name: Compute whether Grid install is needed
  ansible.builtin.set_fact:
    install_grid_needed: >-
      {{ deployment_plan.install_grid and ('LOC="' ~ deployment_plan.release_cfg.GRID_HOME ~ '"' not in
      (install_grid_inventory_xml.content | default('') | b64decode)) }}

- name: Install Grid gold image and configure Oracle Restart
  when: install_grid_needed
  become: true
  block:
    - name: Create Oracle directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: oinstall
        mode: '0775'
        state: directory
      loop:
        - {path: "{{ deployment_plan.release_cfg.GRID_HOME }}", owner: grid}
        - {path: "{{ deployment_plan.release_cfg.GRID_BASE }}", owner: grid}
        - {path: "{{ deployment_plan.release_cfg.ORA_INVENTORY }}", owner: grid}

    - name: Unpack the Grid gold image
      ansible.builtin.unarchive:
        src: "{{ deployment_plan.release_cfg.GRID_IMAGE.path }}"
        dest: "{{ deployment_plan.release_cfg.GRID_HOME }}"
        remote_src: true
        creates: "{{ deployment_plan.release_cfg.GRID_HOME }}/gridSetup.sh"
        owner: grid
        group: oinstall

    - name: Write Grid response file
      ansible.builtin.template:
        src: grid.rsp.j2
        dest: "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
        owner: grid
        group: oinstall
        mode: '0600'

    # Fail with a clear message (before the installer runs) if this image's
    # shipped template does not know one of our keys - e.g. a future image
    # renames them. Skipped with a warning if the image ships no template.
    - name: Inspect the response-file template shipped in the Grid image
      ansible.builtin.stat:
        path: "{{ deployment_plan.release_cfg.GRID_HOME }}/install/response/gridsetup.rsp"
      register: install_grid_shipped_rsp_stat

    - name: Read the shipped template and our response file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ deployment_plan.release_cfg.GRID_HOME }}/install/response/gridsetup.rsp"
        - "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
      register: install_grid_rsp_files
      no_log: true
      when: install_grid_shipped_rsp_stat.stat.exists

    - name: Require every key we set to exist in the image's template
      ansible.builtin.assert:
        that: install_grid_rsp_unknown_keys | length == 0
        fail_msg: >-
          {{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp uses keys this image's gridsetup.rsp
          does not define: {{ install_grid_rsp_unknown_keys | join(', ') }}. Update grid.rsp.j2 in acme.oracle_26ai.
      vars:
        install_grid_rsp_unknown_keys: >-
          {{ (install_grid_rsp_files.results[1].content | b64decode
                | regex_findall('(?m)^([A-Za-z_.]+)='))
             | difference(install_grid_rsp_files.results[0].content | b64decode
                | regex_findall('(?m)^([A-Za-z_.]+)=')) }}
      when: install_grid_shipped_rsp_stat.stat.exists

    - name: Warn that the shipped template could not be compared
      ansible.builtin.debug:
        msg: "No install/response/gridsetup.rsp in the Grid image; response-file keys not pre-checked."
      when: not install_grid_shipped_rsp_stat.stat.exists

    # rc 6 = "Successfully Setup Software with warning(s)" (only IGNORABLE
    # prerequisites failed). Accepted only together with the success line.
    - name: Install Grid software from the gold image
      ansible.builtin.command:
        argv:
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/gridSetup.sh"
          - -silent
          - -responseFile
          - "{{ deployment_plan.release_cfg.GRID_HOME }}/grid.rsp"
          - -waitforcompletion
      become: true
      become_user: grid
      register: install_grid_setup
      changed_when: true
      failed_when: >-
        install_grid_setup.rc not in [0, 6]
        or 'Successfully Setup Software' not in (install_grid_setup.stdout | default(''))
      async: 7200
      poll: 30

    - name: Show installer warnings (rc 6)
      ansible.builtin.debug:
        msg: "{{ install_grid_setup.stdout_lines | select('search', 'PRV|INS-|Error message') | list }}"
      when: install_grid_setup.rc | default(0) == 6

# ── Root configuration, driven by host state (not only first install) ─────
# A run that stopped after gridSetup leaves a registered home whose root
# scripts never ran; these checks make the next run finish the job.
- name: Configure Oracle Restart as root where not yet done
  when: deployment_plan.install_grid
  become: true
  block:
    - name: Inspect central inventory registration (/etc/oraInst.loc)
      ansible.builtin.stat:
        path: /etc/oraInst.loc
      register: install_grid_orainst_loc

    - name: Run inventory root script
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.ORA_INVENTORY }}/orainstRoot.sh"]
      changed_when: true
      when: not install_grid_orainst_loc.stat.exists

    - name: Inspect Oracle Restart registration (/etc/oracle/olr.loc)
      ansible.builtin.slurp:
        src: /etc/oracle/olr.loc
      register: install_grid_olr
      failed_when: false

    - name: Determine whether Oracle Restart is configured from this home
      ansible.builtin.set_fact:
        install_grid_has_configured: >-
          {{ (install_grid_olr.content | default('') | b64decode
              | regex_findall('(?m)^crs_home=(\S+)\s*$') | first | default('')
              | regex_replace('/+$', '')) == deployment_plan.release_cfg.GRID_HOME }}

    - name: Run Grid root script
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/root.sh"]
      changed_when: true
      async: 3600
      poll: 30
      when: not install_grid_has_configured

    - name: Configure Oracle Restart
      ansible.builtin.command:
        argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/crs/install/roothas.sh"]
      changed_when: true
      async: 3600
      poll: 30
      when: not install_grid_has_configured

- name: Verify Oracle Restart service
  ansible.builtin.command:
    argv: ["{{ deployment_plan.release_cfg.GRID_HOME }}/bin/crsctl", check, has]
  changed_when: false
  become: true
  when: deployment_plan.install_grid

- name: Verify the Grid home holds the image version its path names
  ansible.builtin.include_role:
    name: acme.oracle_26ai.verify_home
  vars:
    verify_home_path: "{{ deployment_plan.release_cfg.GRID_HOME }}"
    verify_home_owner: grid
  when: deployment_plan.install_grid

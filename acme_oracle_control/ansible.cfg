[defaults]
inventory = inventory/oracle_targets.yml
# ./collections first (CLI installs), then user and EE/system locations (AAP).
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 1

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True

---
# Replace example hosts with CMDB-synced hosts before use.
all:
  children:
    oracle_targets:
      hosts:
        genx-db-1001.genx.com:
          ansible_host: 192.168.10.31
          deployment_tier: dev
        genx-db-1002.genx.com:
          ansible_host: 192.168.10.32
          deployment_tier: dev

  # ==========================================================================
  # GLOBAL VARIABLES
  # ==========================================================================
  vars:
    # Connection settings
    ansible_user: zz_admin
    ansible_ssh_private_key_file: /home/zz_admin/.ssh/id_ed25519
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
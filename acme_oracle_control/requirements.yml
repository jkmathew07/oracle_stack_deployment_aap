---
# AAP (execution environment build) and CLI with Private Automation Hub:
#   ansible-galaxy collection install -r requirements.yml -p collections
# CLI straight from this repository instead: see requirements-local.yml.
collections:
  - name: acme.linux_baseline
    version: '2.1.1'
  - name: acme.oracle_common
    version: '1.0.5'
  - name: acme.oracle_19c
    version: '1.0.2'
  - name: acme.oracle_26ai
    version: '1.0.2'
  - name: ansible.posix
    version: '2.1.0'
  # AAP only: controller_api lookup used by acme.oracle_common.workflow_guard.
  # Pin to the exact version shipped with your AAP 2.7 installation.
  - name: ansible.controller

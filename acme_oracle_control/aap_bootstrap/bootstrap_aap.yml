---
- name: Define Oracle 19c and 26ai deploy objects on AAP 2.7
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - bootstrap_vars.yml
    # aap_workflows is shared with the workflow_guard role; keep one copy.
    - ../playbooks/group_vars/all/aap_policy.yml
  tasks:
    - name: Attach each workflow's release graph and survey
      ansible.builtin.set_fact:
        aap_workflows_expanded: >-
          {{ aap_workflows_expanded | default([]) + [item | combine({
               'nodes': aap_release_graphs[item.release].nodes,
               'links': aap_release_graphs[item.release].links,
               'survey': aap_surveys[item.release][:1]
                         + [aap_surveys[item.release][1] | combine({'choices': item.environment_choices})]
                         + aap_surveys[item.release][2:]})] }}
      loop: "{{ aap_workflows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create pinned control project
      ansible.controller.project:
        name: "{{ aap_project_name }}"
        organization: "{{ aap_organization }}"
        scm_type: git
        scm_url: "{{ aap_project_scm_url }}"
        scm_branch: "{{ aap_project_scm_branch }}"
        credential: "{{ aap_project_scm_credential }}"
        scm_update_on_launch: false
        state: present

    - name: Sync the pinned project before creating job templates
      ansible.controller.project_update:
        name: "{{ aap_project_name }}"
        organization: "{{ aap_organization }}"
        wait: true

    - name: Create child job templates
      ansible.controller.job_template:
        name: "{{ item.name }}"
        organization: "{{ aap_organization }}"
        job_type: run
        project: "{{ aap_project_name }}"
        playbook: "{{ aap_project_playbook_prefix }}{{ item.playbook }}"
        inventory: "{{ aap_inventory_name }}"
        execution_environment: "{{ aap_execution_environment }}"
        # Controller credential: read-only API access for workflow_guard.
        credentials:
          - "{{ aap_machine_credential }}"
          - "{{ aap_controller_credential }}"
        # Never prompt: children take only the workflow's survey answers and
        # the preflight node's set_stats artifacts (passed by the workflow
        # regardless of this setting). workflow_guard re-checks the plan.
        ask_variables_on_launch: false
        allow_simultaneous: false
        state: present
      loop: "{{ aap_job_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create release- and environment-specific workflows with surveys
      ansible.controller.workflow_job_template:
        name: "{{ item.name }}"
        organization: "{{ aap_organization }}"
        inventory: "{{ aap_inventory_name }}"
        survey_enabled: true
        survey_spec:
          name: "{{ item.name }}"
          description: "Oracle {{ item.release }} deployment request"
          spec: "{{ item.survey }}"
        ask_variables_on_launch: false
        allow_simultaneous: false
        state: present
      loop: "{{ aap_workflows_expanded }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create all job nodes before linking
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "{{ item.0.name }}"
        organization: "{{ aap_organization }}"
        identifier: "{{ item.1.identifier }}"
        unified_job_template: "{{ item.1.job_template }}"
        state: present
      loop: "{{ aap_workflows_expanded | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.identifier }}"

    - name: Create change approval nodes on approval-gated workflows
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "{{ item.name }}"
        organization: "{{ aap_organization }}"
        identifier: "{{ aap_approval_node_identifier }}"
        approval_node:
          name: Approve Oracle host change
          description: Verify target, change ticket, release, RU/image version, homes, media and scope in preflight job output.
          timeout: 86400
        state: present
      loop: "{{ aap_workflows | selectattr('requires_approval') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Link the release stage edges
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "{{ item.0.name }}"
        organization: "{{ aap_organization }}"
        identifier: "{{ item.1.from }}"
        success_nodes: ["{{ item.1.to }}"]
        state: present
      loop: "{{ aap_workflows_expanded | subelements('links') }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.from }} -> {{ item.1.to }}"

    - name: Link preflight according to the workflow's approval policy
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "{{ item.name }}"
        organization: "{{ aap_organization }}"
        identifier: "{{ aap_preflight_node_identifier }}"
        success_nodes: "{{ [aap_approval_node_identifier] if item.requires_approval else ['baseline'] }}"
        state: present
      loop: "{{ aap_workflows }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Link approval to OS baseline
      ansible.controller.workflow_job_template_node:
        workflow_job_template: "{{ item.name }}"
        organization: "{{ aap_organization }}"
        identifier: "{{ aap_approval_node_identifier }}"
        success_nodes: [baseline]
        state: present
      loop: "{{ aap_workflows | selectattr('requires_approval') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # RBAC is part of the control: operators may launch workflows only. No
    # team is granted execute on the child job templates, so a stage cannot
    # be started on its own (workflow_guard also refuses it).
    - name: Grant launch rights on each workflow to its operator team
      ansible.controller.role:
        team: "{{ item.launch_team }}"
        role: execute
        workflows: ["{{ item.name }}"]
        state: present
      loop: "{{ aap_workflows }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.launch_team }}"

    - name: Grant change approval rights on approval-gated workflows
      ansible.controller.role:
        team: "{{ aap_change_approver_team }}"
        role: approval
        workflows: ["{{ item.name }}"]
        state: present
      loop: "{{ aap_workflows | selectattr('requires_approval') | list }}"
      loop_control:
        label: "{{ item.name }}"

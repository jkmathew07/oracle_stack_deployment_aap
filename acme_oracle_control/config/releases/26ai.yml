---
RELEASE: '26ai'

SUPPORTED_OS:
  - { distribution: OracleLinux, major_version: '9' }
  - { distribution: RedHat, major_version: '9' }
  - { distribution: OracleLinux, major_version: '10' }
  - { distribution: RedHat, major_version: '10' }

MIN_MEM_MB: 8000
MIN_VCPU: 2
MIN_SWAP_MB: 16000

RESPONSE_FILE_SCHEMA_VERSION: '23.0.0'

# Must equal the gold image version (oraversion -compositeVersion prefix).
RU_VERSION: '23.26.3'

ORA_INVENTORY: /u01/app/oraInventory
GRID_HOME_PATTERN: /u01/app/{RU_VERSION}/grid
GRID_BASE: /u01/app/grid
DB_HOME_PATTERN: /u01/app/oracle/product/{RU_VERSION}/oracle
DB_BASE: /u01/app/oracle

GRID_IMAGE:
  path: /mnt/nfs/nfsshare/ora_binaries/golden_images/23.26.3/grid/p39581618_230000_Linux-x86-64.zip
  sha256: ''
DB_IMAGE:
  path: /mnt/nfs/nfsshare/ora_binaries/golden_images/23.26.3/oracle/p39581612_230000_Linux-x86-64.zip
  sha256: ''

PREINSTALL_PACKAGE:
  name: oracle-ai-database-preinstall-26ai
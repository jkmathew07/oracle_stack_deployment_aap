---
# Oracle AI Database 26ai release file, used only by the acme.oracle_26ai
# workflows. Oracle ships 26ai Grid and DB homes as PATCHED GOLD IMAGES, so
# there is no RU/OPatch/interim patching: a newer image is installed as a new
# RU-versioned home. CHANGE_ME values fail closed until qualified.
RELEASE: '26ai'

# Verify against Oracle's 26ai certification matrix before editing.
SUPPORTED_OS:
  - { distribution: OracleLinux, major_version: '9' }
  - { distribution: RedHat, major_version: '9' }

MIN_MEM_MB: 16384
MIN_VCPU: 2
MIN_SWAP_MB: 16384

# Response-file schema suffix (rspfmt_*_response_schema_v<this>). Take it
# from <home>/install/response/*.rsp inside the gold image.
RESPONSE_FILE_SCHEMA_VERSION: 'CHANGE_ME'

# ── RU-versioned homes ────────────────────────────────────────────────────
# RU_VERSION = the gold image version (NN.N.N, e.g. 23.26.1). It names the
# homes and is checked against `oraversion -compositeVersion` after install.
# *_HOME_PATTERN must contain {RU_VERSION} exactly once as a path component;
# it is substituted by plain string replacement (never Jinja).
RU_VERSION: 'CHANGE_ME'

ORA_INVENTORY: /u01/app/oraInventory
GRID_HOME_PATTERN: /u01/app/{RU_VERSION}/grid
GRID_BASE: /u01/app/grid
DB_HOME_PATTERN: /u01/app/oracle/product/{RU_VERSION}/oracle
DB_BASE: /u01/app/oracle

# Gold images from Oracle Support. sha256 optional ('' = unzip -tq test only).
GRID_IMAGE:
  path: CHANGE_ME_26AI_GRID_GOLD_IMAGE_ZIP
  sha256: ''
DB_IMAGE:
  path: CHANGE_ME_26AI_DB_GOLD_IMAGE_ZIP
  sha256: ''

# Oracle Linux: installed by name from the approved dnf repos. RHEL: staged
# RPM from oracle_os_packages_local (playbooks/group_vars/all/os_packages.yml).
PREINSTALL_PACKAGE:
  name: oracle-ai-database-preinstall-26ai

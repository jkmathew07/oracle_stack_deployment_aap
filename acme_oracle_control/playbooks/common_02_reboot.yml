---
- name: Reboot only if identity, limits or HugePages changed
  hosts: "{{ hostname | default('localhost') }}"
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Guard - approved plan, target, tier, release and workflow provenance
      ansible.builtin.include_role:
        name: acme.oracle_common.stage_guard
  tasks:
    - name: Reboot and verify host connectivity
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30
      become: true
      when: baseline_reboot_required | default(false) | bool

---
- name: 19c - install Grid (Oracle Restart) with -applyRU
  hosts: "{{ hostname | default('localhost') }}"
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Guard - approved plan, target, tier, release and workflow provenance
      ansible.builtin.include_role:
        name: acme.oracle_common.stage_guard
      vars:
        stage_guard_release: '19c'
  tasks:
    - name: Install Oracle Restart software and configuration
      ansible.builtin.include_role:
        name: acme.oracle_19c.install_grid

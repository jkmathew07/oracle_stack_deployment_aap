---
# Command-line entry point for 26ai: one ansible-playbook process runs every
# stage, so the plan built by node 00 stays in memory as a host fact.
# Same order as the AAP workflow. Production is refused outside AAP.
#   ansible-playbook playbooks/26ai_site.yml -e @params/examples/26ai_grid_and_db.yml
- name: Import 26ai_00_preflight.yml
  import_playbook: 26ai_00_preflight.yml
- name: Import common_01_baseline.yml
  import_playbook: common_01_baseline.yml
- name: Import common_02_reboot.yml
  import_playbook: common_02_reboot.yml
- name: Import 26ai_03_install_grid.yml
  import_playbook: 26ai_03_install_grid.yml
- name: Import 26ai_04_install_db.yml
  import_playbook: 26ai_04_install_db.yml
- name: Import 26ai_05_verify.yml
  import_playbook: 26ai_05_verify.yml

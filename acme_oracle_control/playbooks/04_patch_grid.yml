---
- name: Apply Grid RU if requested
  hosts: "{{ hostname | default('localhost') }}"
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Confirm this job has an approved single-host deployment plan
      ansible.builtin.assert:
        that:
          - deployment_plan is defined
          - inventory_hostname == deployment_plan.target
          - hostvars[inventory_hostname].deployment_tier == deployment_plan.environment
        fail_msg: Invalid or mismatched workflow plan; stopping before changes.
  tasks:
    - name: Validate, apply and verify Grid RU
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.patch_grid

    - name: Apply approved Grid interim patches (best-effort, see role header)
      ansible.builtin.include_role:
        name: acme.oracle_rdbms.patch_grid_oneoffs

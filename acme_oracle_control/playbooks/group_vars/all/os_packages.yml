---
# Install only from enterprise-signed repositories. Add certified packages
# for the selected Oracle release/OS image in the release qualification process.
oracle_os_packages:
  - binutils
  - glibc
  - glibc-devel
  - ksh
  - libaio
  - libnsl
  - libstdc++
  - make
  - unzip
  - systat
  - libXau
  - libXi
  - libXtst
  - libxcb
  - libxcb-devel

oracle_os_packages_local_dir: /mnt/nfs/nfsshare/oracle_pre_install_rpms
oracle_os_packages_local:

---
- name: 19c - verify DB RU and apply interim patches
  hosts: "{{ hostname | default('localhost') }}"
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Guard - approved plan, target, tier, release and workflow provenance
      ansible.builtin.include_role:
        name: acme.oracle_common.stage_guard
      vars:
        stage_guard_release: '19c'
  tasks:
    - name: Verify the DB home carries its RU
      ansible.builtin.include_role:
        name: acme.oracle_19c.patch_db

    - name: Apply approved DB interim patches
      ansible.builtin.include_role:
        name: acme.oracle_19c.patch_db_oneoffs

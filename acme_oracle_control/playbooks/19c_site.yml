---
# Command-line entry point for 19c: one ansible-playbook process runs every
# stage, so the plan built by node 00 stays in memory as a host fact.
# Same order as the AAP workflow. Production is refused outside AAP.
#   ansible-playbook playbooks/19c_site.yml -e @params/examples/19c_grid_and_db.yml
- name: Import 19c_00_preflight.yml
  import_playbook: 19c_00_preflight.yml
- name: Import common_01_baseline.yml
  import_playbook: common_01_baseline.yml
- name: Import common_02_reboot.yml
  import_playbook: common_02_reboot.yml
- name: Import 19c_03_install_grid.yml
  import_playbook: 19c_03_install_grid.yml
- name: Import 19c_04_patch_grid.yml
  import_playbook: 19c_04_patch_grid.yml
- name: Import 19c_05_install_db.yml
  import_playbook: 19c_05_install_db.yml
- name: Import 19c_06_patch_db.yml
  import_playbook: 19c_06_patch_db.yml
- name: Import 19c_07_verify.yml
  import_playbook: 19c_07_verify.yml

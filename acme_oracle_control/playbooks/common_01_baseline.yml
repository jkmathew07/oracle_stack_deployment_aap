---
- name: Apply approved Oracle OS baseline
  hosts: "{{ hostname | default('localhost') }}"
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Guard - approved plan, target, tier, release and workflow provenance
      ansible.builtin.include_role:
        name: acme.oracle_common.stage_guard
  tasks:
    - name: Apply scoped baseline
      ansible.builtin.include_role:
        name: acme.linux_baseline.configure_baseline
      when: deployment_plan.install_grid or deployment_plan.install_db

    - name: Set Transparent HugePages (madvise) now and at every boot
      ansible.builtin.include_role:
        name: acme.oracle_common.configure_thp
      when: deployment_plan.install_grid or deployment_plan.install_db

    # The reboot decision lives ON THE HOST, so it works the same from the
    # command line and AAP, and survives a failed or re-run baseline.
    - name: Create the automation state directory
      ansible.builtin.file:
        path: /var/log/oracle-automation
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      when: configure_baseline_reboot_required | default(false) | bool

    - name: Record a pending reboot on the host
      ansible.builtin.copy:
        dest: /var/log/oracle-automation/reboot-required
        content: "Set by Oracle baseline for {{ deployment_plan.ticket }}\n"
        owner: root
        group: root
        mode: '0644'
      become: true
      when: configure_baseline_reboot_required | default(false) | bool

    - name: Publish reboot requirement
      ansible.builtin.set_stats:
        per_host: false
        data:
          baseline_reboot_required: "{{ configure_baseline_reboot_required | default(false) }}"
